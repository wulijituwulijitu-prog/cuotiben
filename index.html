<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题本 · 公务员考试</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #131a24;
    --border: #1e2a3a;
    --accent: #00d4aa;
    --danger: #ff6b6b;
    --warn: #ffc048;
    --text: #c8d6e5;
    --text-dim: #6b7d95;
    --glow: rgba(0, 212, 170, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  .container { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 32px 20px; }

  /* ====== Top bar ====== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px;
    flex-wrap: wrap; gap: 16px;
  }
  .topbar h1 {
    font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 1px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar h1 .dot {
    width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
  }
  .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ====== Buttons ====== */
  .btn {
    padding: 8px 20px; border-radius: 8px; font-size: 0.85rem;
    font-weight: 500; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    transition: all 0.25s; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
  .btn-primary { background: var(--accent); color: #0a0e14; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { box-shadow: 0 0 20px rgba(0, 212, 170, 0.35); }
  .btn-sm { padding: 5px 12px; font-size: 0.78rem; border-radius: 6px; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); box-shadow: 0 0 14px rgba(255, 107, 107, 0.2); }

  /* ====== Sync ====== */
  .sync-btn { position: relative; display: flex; align-items: center; gap: 6px; }
  .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sync-dot.off { background: #555; }
  .sync-dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .sync-dot.syncing { background: var(--warn); animation: syncPulse 0.8s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .sync-status-text { font-size: 0.72rem; color: var(--text-dim); }

  /* ====== Stats row ====== */
  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; text-align: center;
  }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: #fff; }
  .stat-card .num.accent { color: var(--accent); }
  .stat-card .num.warn { color: var(--warn); }
  .stat-card .num.danger { color: var(--danger); }
  .stat-card .lbl { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; }

  /* ====== Toolbar ====== */
  .toolbar {
    display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input, .toolbar select {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; color: var(--text); font-size: 0.85rem; outline: none;
    transition: border-color 0.25s;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar select { min-width: 120px; }

  /* ====== Table ====== */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: 0.88rem;
  }
  thead th {
    text-align: left; padding: 12px 14px; background: var(--surface);
    color: var(--text-dim); font-weight: 600; font-size: 0.75rem;
    text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr { transition: background 0.2s; }
  tbody tr:hover { background: rgba(255,255,255,0.015); }

  .subj-tag {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 0.75rem; font-weight: 500;
    background: rgba(0, 212, 170, 0.1); color: var(--accent);
  }
  .mastered .subj-tag { background: rgba(0, 212, 170, 0.05); color: var(--text-dim); }
  .mastered td { color: var(--text-dim); }
  .mastered td { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: rgba(255,255,255,0.08); }
  .mastered td:last-child,
  .mastered td:nth-child(1) { text-decoration: none; }

  .review-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 0.72rem; font-weight: 500;
  }
  .review-badge.overdue { background: rgba(255, 107, 107, 0.15); color: var(--danger); }
  .review-badge.soon { background: rgba(255, 192, 72, 0.15); color: var(--warn); }
  .review-badge.ok { background: rgba(0, 212, 170, 0.1); color: var(--accent); }

  .actions-cell { display: flex; gap: 6px; }

  /* ====== Modal ====== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; width: 90%; max-width: 620px; max-height: 85vh;
    overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h2 { color: #fff; font-size: 1.15rem; margin-bottom: 24px; letter-spacing: 1px; }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 0.78rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text); font-size: 0.9rem; outline: none;
    font-family: inherit; transition: border-color 0.25s; resize: vertical;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* Modal tabs */
  .modal-tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .modal-tab {
    flex: 1; padding: 10px; text-align: center; font-size: 0.85rem; font-weight: 500;
    background: var(--bg); color: var(--text-dim); border: none; cursor: pointer;
    transition: all 0.25s;
  }
  .modal-tab + .modal-tab { border-left: 1px solid var(--border); }
  .modal-tab:hover { color: var(--text); }
  .modal-tab.active { background: var(--accent); color: #0a0e14; font-weight: 600; }

  .quick-hint {
    font-size: 0.78rem; color: var(--text-dim); margin-bottom: 18px;
    padding: 10px 14px; background: rgba(0, 212, 170, 0.05); border-radius: 8px;
    border-left: 3px solid var(--accent); line-height: 1.6;
  }

  .hidden { display: none !important; }

  /* ====== Empty state ====== */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 0.9rem; }

  /* ====== Footer ====== */
  .footer {
    text-align: center; padding: 32px 0 16px; font-size: 0.75rem;
    color: var(--text-dim); letter-spacing: 1px;
  }

  /* ====== Quiz mode ====== */
  .quiz-panel { margin-bottom: 28px; }
  .quiz-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .quiz-progress-bar {
    flex: 1; min-width: 100px; height: 6px; background: var(--border);
    border-radius: 3px; overflow: hidden;
  }
  .quiz-progress-fill {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width 0.35s ease;
  }
  .quiz-counter { font-size: 0.85rem; color: var(--text-dim); white-space: nowrap; }

  .quiz-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; margin-bottom: 20px;
  }
  .quiz-subject-tag {
    display: inline-block; padding: 3px 12px; border-radius: 12px;
    font-size: 0.75rem; font-weight: 500; margin-bottom: 16px;
    background: rgba(0, 212, 170, 0.1); color: var(--accent);
  }
  .quiz-question-text {
    font-size: 1.05rem; line-height: 1.9; color: #e8edf3; margin-bottom: 28px;
    letter-spacing: 0.3px;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 12px; }
  .quiz-option {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 20px; border: 2px solid var(--border); border-radius: 12px;
    background: var(--bg); cursor: pointer; transition: all 0.2s;
    text-align: left; font-size: 0.95rem; color: var(--text);
    line-height: 1.7;
  }
  .quiz-option:hover:not(.revealed) { border-color: var(--accent); background: rgba(0, 212, 170, 0.04); }
  .quiz-option .opt-letter {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem;
    background: var(--border); color: var(--text-dim);
    transition: all 0.2s;
  }
  .quiz-option.revealed { cursor: default; }
  .quiz-option.revealed.correct-choice {
    border-color: var(--accent); background: rgba(0, 212, 170, 0.08);
    box-shadow: 0 0 16px rgba(0, 212, 170, 0.15);
  }
  .quiz-option.revealed.correct-choice .opt-letter {
    background: var(--accent); color: #0a0e14;
  }
  .quiz-option.revealed.wrong-choice {
    border-color: var(--danger); background: rgba(255, 107, 107, 0.06);
  }
  .quiz-option.revealed.wrong-choice .opt-letter {
    background: var(--danger); color: #fff;
  }
  .quiz-option.revealed.dimmed { opacity: 0.45; }

  .quiz-feedback {
    margin-top: 20px; padding: 18px 20px; border-radius: 12px;
    font-size: 0.9rem; line-height: 1.7;
  }
  .quiz-feedback.correct { background: rgba(0, 212, 170, 0.08); border: 1px solid rgba(0, 212, 170, 0.25); }
  .quiz-feedback.wrong { background: rgba(255, 107, 107, 0.06); border: 1px solid rgba(255, 107, 107, 0.2); }
  .quiz-feedback .fb-title { font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
  .quiz-feedback.correct .fb-title { color: var(--accent); }
  .quiz-feedback.wrong .fb-title { color: var(--danger); }
  .quiz-feedback .fb-reason { color: var(--text-dim); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  .quiz-nav { display: flex; gap: 12px; justify-content: center; align-items: center; }
  .quiz-nav .btn { min-width: 100px; }

  .quiz-summary {
    text-align: center; padding: 48px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  }
  .quiz-summary .score { font-size: 3.5rem; font-weight: 700; color: #fff; }
  .quiz-summary .score.perfect { color: var(--accent); }
  .quiz-summary .score.good { color: var(--warn); }
  .quiz-summary .detail { color: var(--text-dim); margin: 12px 0 24px; font-size: 0.9rem; }

  @media (max-width: 700px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .form-row { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .quiz-card { padding: 20px; }
    .quiz-question-text { font-size: 0.95rem; }
    .quiz-option { padding: 14px 16px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="container">

  <div class="topbar">
    <h1><span class="dot"></span>错题本</h1>
    <div class="topbar-actions">
      <button class="btn sync-btn" onclick="toggleSyncSettings()" id="syncBtn" title="云同步">
        <span class="sync-dot off" id="syncDot"></span>云同步
      </button>
      <button class="btn" onclick="exportData()">导出备份</button>
      <label class="btn" style="cursor:pointer;">
        导入恢复
        <input type="file" accept=".json" onchange="importData(event)" style="display:none;">
      </label>
      <button class="btn" onclick="startDailyQuiz()" id="dailyQuizBtn" style="background:var(--accent);color:#fff;border-color:var(--accent);">每日20题</button>
      <button class="btn" onclick="startQuiz()" id="quizModeBtn">刷题模式</button>
      <button class="btn" onclick="forceEnrich()" id="enrichBtn" style="color:var(--warn);border-color:var(--warn);display:none;">更新解析</button>
      <button class="btn btn-primary" onclick="openModal()">+ 添加错题</button>
    </div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="lbl">总错题数</div>
    </div>
    <div class="stat-card">
      <div class="num accent" id="statMastered">0</div>
      <div class="lbl">已掌握</div>
    </div>
    <div class="stat-card">
      <div class="num warn" id="statUnreviewed">0</div>
      <div class="lbl">待复习</div>
    </div>
    <div class="stat-card">
      <div class="num danger" id="statOverdue">0</div>
      <div class="lbl">逾期未复习</div>
    </div>
  </div>

  <!-- 搜索筛选栏 -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索题目、知识点…" oninput="renderTable()">
    <select id="filterSubject" onchange="renderTable()">
      <option value="all">全部科目</option>
    </select>
    <select id="filterStatus" onchange="renderTable()">
      <option value="all">全部状态</option>
      <option value="unmastered">未掌握</option>
      <option value="mastered">已掌握</option>
      <option value="overdue">逾期未复习</option>
    </select>
  </div>

  <!-- 错题列表 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>科目</th>
          <th>题目</th>
          <th>错误答案</th>
          <th>正确答案</th>
          <th>错误原因</th>
          <th>复习</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">
      <div class="icon">📋</div>
      <p>还没有错题记录</p>
      <p style="font-size:0.8rem;">点击「添加错题」开始记录</p>
    </div>
  </div>

  <!-- ====== 刷题模式 ====== -->
  <div class="quiz-panel hidden" id="quizPanel">
    <div class="quiz-header">
      <button class="btn" onclick="exitQuiz()">← 返回列表</button>
      <span class="quiz-mode-tag" id="quizModeTag" style="font-size:0.75rem;color:var(--accent);font-weight:600;padding:2px 8px;border:1px solid var(--accent);border-radius:10px;margin-right:8px;">每日20题</span>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill" style="width:0%"></div></div>
      <span class="quiz-counter" id="quizCounter">1/16</span>
    </div>
    <div id="quizContent"></div>
    <div class="quiz-nav" id="quizNav">
      <button class="btn" id="quizPrevBtn" onclick="prevQuestion()" disabled>上一题</button>
      <button class="btn btn-primary" id="quizNextBtn" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <div class="footer">ERROR LOG SYSTEM · 温故而知新</div>
</div>

<!-- ====== Modal ====== -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">添加错题</h2>
    <input type="hidden" id="editId">

    <!-- Tab switch -->
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchTab('manual')">手动填写</button>
      <button class="modal-tab" onclick="switchTab('quick')">一键录入</button>
    </div>

    <!-- 一键录入 panel -->
    <div class="quick-panel hidden" id="quickPanel">
      <p class="quick-hint">把整道题的文字粘贴进来，系统自动拆分填写。手机端可先用微信「提取文字」功能识别拍照内容。</p>
      <div class="form-group">
        <label>科目</label>
        <select id="quickSubject">
          <option value="">自动识别</option>
          <option value="言语理解与表达">言语理解与表达</option>
          <option value="数量关系">数量关系</option>
          <option value="判断推理">判断推理</option>
          <option value="资料分析">资料分析</option>
          <option value="常识判断">常识判断</option>
          <option value="申论">申论</option>
          <option value="公共基础知识">公共基础知识</option>
          <option value="面试">面试</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>粘贴完整题目文字</label>
        <textarea id="quickText" rows="8" placeholder="把题目、选项、你的答案、正确答案、解析…全部粘贴进来
例如：
1. 下列关于GDP的说法正确的是？
A. GDP=GNP  B. GDP包括中间产品  C. GDP按国土原则计算  D. GDP只算服务业
我的答案：A
正确答案：C
解析：GDP按国土原则，GNP按国民原则"></textarea>
      </div>
      <button class="btn btn-primary" onclick="parseQuickText()" style="width:100%;">自动拆分 ▸</button>
    </div>

    <!-- 手动填写 panel -->
    <div id="manualPanel">
    <div class="form-row">
      <div class="form-group">
        <label>科目</label>
        <select id="formSubject">
          <option value="">请选择</option>
          <option value="言语理解与表达">言语理解与表达</option>
          <option value="数量关系">数量关系</option>
          <option value="判断推理">判断推理</option>
          <option value="资料分析">资料分析</option>
          <option value="常识判断">常识判断</option>
          <option value="申论">申论</option>
          <option value="公共基础知识">公共基础知识</option>
          <option value="面试">面试</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>掌握程度</label>
        <select id="formMastered">
          <option value="0">未掌握</option>
          <option value="1">已掌握</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>题目</label>
      <input type="text" id="formQuestion" placeholder="简要描述题目内容…">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>我的错误答案</label>
        <input type="text" id="formWrong" placeholder="你当时选的/写的答案…">
      </div>
      <div class="form-group">
        <label>正确答案</label>
        <input type="text" id="formCorrect" placeholder="标准答案…">
      </div>
    </div>

    <div class="form-group">
      <label>错误原因分析</label>
      <textarea id="formReason" rows="3" placeholder="为什么会错？是知识点不牢、审题不清、还是计算失误？…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
    </div>
    </div><!-- end manualPanel -->

  </div>
</div>

<!-- ====== Sync Settings Modal ====== -->
<div class="modal-overlay hidden" id="syncOverlay">
  <div class="modal" style="max-width:440px;">
    <h2>云同步设置</h2>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:20px;line-height:1.7;">
      使用 GitHub Gist 存储数据，手机电脑自动同步。<br>
      1. 前往 <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--accent);">GitHub Token 页面</a> 创建一个 Token，勾选 <b>gist</b> 权限<br>
      2. 将 Token 粘贴到下方，点击「连接并同步」
    </p>
    <div class="form-group">

        <button class="btn" onclick="closeSyncSettings()">取消</button>

<script>
const STORAGE_KEY = 'errorbook_data_v4';
const QUIZ_SESSION_KEY = 'errorbook_quiz_session_v1';
const DAILY_SESSION_KEY = 'errorbook_daily_session_v1';

let records = [];
let subjects = new Set();

// ====== Cloud Sync (GitHub Gist) ======
const SYNC_CFG_KEY = 'errorbook_sync_config_v1';
let syncCfg = { token: '', gistId: '' };

function loadSyncCfg() {
  try {
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if (raw) syncCfg = JSON.parse(raw);
  } catch { syncCfg = { token: '', gistId: '' }; }
}

function saveSyncCfg() {
  try {
    localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg));
  } catch {}
}

function isSyncReady() {
  return !!(syncCfg.token && syncCfg.gistId);
}

function setSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  if (dot) {
    dot.className = 'sync-dot ' + state;
  }
}

function toggleSyncSettings() {
  const overlay = document.getElementById('syncOverlay');
  if (overlay.classList.contains('hidden')) {
    loadSyncCfg();
    document.getElementById('syncToken').value = syncCfg.token || '';
    document.getElementById('syncGistId').value = syncCfg.gistId || '';
    document.getElementById('syncMsg').style.display = 'none';
    if (isSyncReady()) {
      document.getElementById('connectBtn').textContent = '保存并同步';
      document.getElementById('disconnectBtn').style.display = '';
    } else {
      document.getElementById('connectBtn').textContent = '连接并同步';
      document.getElementById('disconnectBtn').style.display = 'none';
    }
    overlay.classList.remove('hidden');
  } else {
    closeSyncSettings();
  }
}

function closeSyncSettings() {
  document.getElementById('syncOverlay').classList.add('hidden');
}

function showSyncMsg(msg, color) {
  const el = document.getElementById('syncMsg');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.color = color || 'var(--text-dim)';
}

async function connectSync() {
  const token = document.getElementById('syncToken').value.trim();
  if (!token) { showSyncMsg('请输入 GitHub Token', 'var(--danger)'); return; }
  showSyncMsg('正在验证连接…', 'var(--warn)');
  setSyncStatus('syncing');

  try {
    // Test token by fetching user info
    const userResp = await fetch('https://api.github.com/user', {
      headers: { Authorization: `token ${token}` }
    });
    if (!userResp.ok) {
      showSyncMsg('Token 无效，请检查后重试', 'var(--danger)');
      setSyncStatus('error');
      return;
    }
    const user = await userResp.json();

    // If no gist ID, try to find existing one or create new
    let gistId = document.getElementById('syncGistId').value.trim() || syncCfg.gistId;

    if (gistId) {
      // Test existing gist
      const testResp = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { Authorization: `token ${token}` }
      });
      if (!testResp.ok) gistId = '';
    }

    if (!gistId) {
      // Try to auto-discover existing Gist (for second device)
      showSyncMsg('正在查找已有同步数据…', 'var(--warn)');
      const listResp = await fetch('https://api.github.com/gists?per_page=100', {
        headers: { Authorization: `token ${token}` }
      });
      if (listResp.ok) {
        const gists = await listResp.json();
        for (const g of gists) {
          if (g.description === '错题本数据 · 云同步' &&
              g.files && g.files['errorbook.json']) {
            gistId = g.id;
            break;
          }
        }
      }

      if (!gistId) {
        // Create new gist (first device setup)
        const createResp = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            description: '错题本数据 · 云同步',
            public: false,
            files: {
              'errorbook.json': { content: JSON.stringify(records.length > 0 ? records : getDefaultData(), null, 2) }
            }
          })
        });
        if (!createResp.ok) {
          const err = await createResp.json();
          showSyncMsg('创建 Gist 失败: ' + (err.message || createResp.status), 'var(--danger)');
          setSyncStatus('error');
          return;
        }
        const gist = await createResp.json();
        gistId = gist.id;
      }
    }

    const isNewGist = !syncCfg.gistId; // newly created vs auto-discovered

    // Save config
    syncCfg = { token, gistId };
    saveSyncCfg();
    document.getElementById('syncGistId').value = gistId;
    document.getElementById('connectBtn').textContent = '保存并同步';
    document.getElementById('disconnectBtn').style.display = '';
    setSyncStatus('on');
    showSyncMsg(`已连接 · GitHub: ${user.login} · 数据已同步`, 'var(--accent)');

    if (isNewGist) {
      // First device: push local data to new gist
      await pushToGist();
    } else {
      // Second device: pull cloud data first, then push to merge
      await pullAndMerge();
    }
  } catch(e) {
    showSyncMsg('网络错误，请检查网络后重试', 'var(--danger)');
    setSyncStatus('error');
  }
}

function disconnectSync() {
  if (!confirm('断开云同步？本地数据不会丢失。')) return;
  syncCfg = { token: '', gistId: '' };
  saveSyncCfg();
  document.getElementById('syncToken').value = '';
  document.getElementById('syncGistId').value = '';
  document.getElementById('connectBtn').textContent = '连接并同步';
  document.getElementById('disconnectBtn').style.display = 'none';
  document.getElementById('syncMsg').style.display = 'none';
  setSyncStatus('off');
}

async function pushToGist() {
  if (!isSyncReady()) return false;
  try {
    setSyncStatus('syncing');
    const resp = await fetch(`https://api.github.com/gists/${syncCfg.gistId}`, {
      method: 'PATCH',
      headers: {
        Authorization: `token ${syncCfg.token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: { 'errorbook.json': { content: JSON.stringify(records, null, 2) } }
      })
    });
    if (resp.ok) {
      setSyncStatus('on');
      return true;
    }
    setSyncStatus('error');
    return false;
  } catch {
    setSyncStatus('error');
    return false;
  }
}

async function pullFromGist() {
  if (!isSyncReady()) return null;
  try {
    setSyncStatus('syncing');
    const resp = await fetch(`https://api.github.com/gists/${syncCfg.gistId}`, {
      headers: { Authorization: `token ${syncCfg.token}` }
    });
    if (!resp.ok) { setSyncStatus('error'); return null; }
    const gist = await resp.json();
    const file = gist.files['errorbook.json'];
    if (!file || !file.content) { setSyncStatus('on'); return null; }
    const data = JSON.parse(file.content);
    if (!Array.isArray(data)) { setSyncStatus('error'); return null; }
    setSyncStatus('on');
    return data;
  } catch {
    setSyncStatus('error');
    return null;
  }
}

async function pullAndMerge() {
  const gistData = await pullFromGist();
  if (gistData && gistData.length > 0) {
    // Merge: Gist is source of truth, but preserve local data that doesn't exist in Gist
    const gistIds = new Set(gistData.map(r => r.id));
    const localOnly = records.filter(r => !gistIds.has(r.id));
    records = [...gistData, ...localOnly];
    // Apply enriched reasons from defaults
    let syncChanged = enrichReasons(records);
    if (mergeNewRecords(records)) syncChanged = true;
    if (syncChanged) { try { save(); } catch {} }
    renderAll();
    updateEnrichBtn();
  } else if (gistData && gistData.length === 0 && records.length > 0) {
    // Gist is empty but local has data, push local
    await pushToGist();
  }
}

// Sync settings modal click-outside close
document.addEventListener('DOMContentLoaded', function() {
  const syncOverlay = document.getElementById('syncOverlay');
  if (syncOverlay) {
    syncOverlay.addEventListener('click', function(e) {
      if (e.target === this) closeSyncSettings();
    });
  }
});

function enrichReasons(targets) {
  let updated = false;
  try {
    const defaults = getDefaultData();
    const defaultMap = {};
    defaults.forEach(d => { defaultMap[d.id] = d; });
    targets.forEach(r => {
      if (defaultMap[r.id] && defaultMap[r.id].reason && defaultMap[r.id].reason !== r.reason) {
        r.reason = defaultMap[r.id].reason;
        updated = true;
      }
    });
  } catch {}
  return updated;
}

function mergeNewRecords(targets) {
  // Add new questions from defaults that don't exist in current data
  let added = false;
  try {
    const defaults = getDefaultData();
    const existingIds = new Set(targets.map(r => r.id));
    defaults.forEach(d => {
      if (!existingIds.has(d.id)) {
        targets.push(d);
        added = true;
      }
    });
  } catch {}
  return added;
}

function forceEnrich() {
  const btn = document.getElementById('enrichBtn');
  let changed = enrichReasons(records);
  if (mergeNewRecords(records)) changed = true;
  if (changed) {
    save();
    renderAll();
    btn.textContent = '已更新！';
    btn.style.color = 'var(--accent)';
    btn.style.borderColor = 'var(--accent)';
    setTimeout(() => {
      btn.textContent = '更新解析';
      btn.style.color = 'var(--warn)';
      btn.style.borderColor = 'var(--warn)';
      updateEnrichBtn();
    }, 2000);
  } else {
    btn.textContent = '已是最新';
    setTimeout(() => {
      btn.textContent = '更新解析';
      updateEnrichBtn();
    }, 1500);
  }
}

function updateEnrichBtn() {
  const btn = document.getElementById('enrichBtn');
  if (!btn) return;
  let show = false;
  try {
    const defaults = getDefaultData();
    const defaultMap = {};
    defaults.forEach(d => { defaultMap[d.id] = d; });
    const existingIds = new Set(records.map(r => r.id));
    // Show if any new question is missing or any reason is outdated
    show = defaults.some(d => !existingIds.has(d.id)) ||
           records.some(r => defaultMap[r.id] && defaultMap[r.id].reason && defaultMap[r.id].reason !== r.reason);
  } catch {}
  btn.style.display = show ? '' : 'none';
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    let loaded = raw ? JSON.parse(raw) : null;
    if (!loaded || !Array.isArray(loaded) || loaded.length === 0) {
      records = getDefaultData();
      try { save(); } catch {}
    } else {
      let changed = enrichReasons(loaded);
      if (mergeNewRecords(loaded)) changed = true;
      records = loaded;
      if (changed) { try { save(); } catch {} }
    }
  } catch {
    try { records = getDefaultData(); } catch { records = []; }
  }
  refreshSubjects();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch {}
  refreshSubjects();
  if (isSyncReady()) pushToGist();
}

function autoDetectSubject(text) {

    ['判断推理', /(推理|逻辑|定义|类比|图形|加强|削弱|前提|假设|结论|真假|排列组合|论证|三段论|归纳|演绎)/],
    ['资料分析', /(资料|数据|表格|图表|增长率|比重|倍数|百分点|同比|环比|基期|现期|年均|速算|截位|直除)/],
    ['常识判断', /(常识|法律|宪法|刑法|民法|行政法|政治|党史|时政|历史|地理|生物|化学|物理|天文|科技|文史|经济|文化|节气|节日)/],
    ['申论', /(申论|概括|分析|对策|建议|应用文|公文|议论文|方案|报告|讲话稿|提纲|简报|编者按|短评|倡议书|回复)/],
    ['公共基础知识', /(公[共基]|政治理论|马[克哲]|毛[概]|邓|法治|省情|国情|管理|公文|道德|经济[学]|法[学律规])/],
    ['面试', /(面试|结构化|无领导|模拟|演讲|应变|人际|组织|计划|协调|情景模拟|即兴)/],
  ];
  for (const [subject, re] of map) {
    if (re.test(text)) return subject;

function parseQuickText() {
  const raw = document.getElementById('quickText').value.trim();
  if (!raw) { alert('请先粘贴题目文字'); return; }

  let question = '', wrong = '', correct = '', reason = '';

  // 清理题号前缀
  const cleaned = raw.replace(/^[\s]*[\d]+[\.\、\)）\s]+/, '').trim();

  // Pattern 1: 显式标签 — 题目：/ 正确答案：/ 解析： 等
  const qMatch = cleaned.match(/题目[：:]\s*(.+?)(?=\n[^\n]*(?:答案|正确|错误|我[的选]|解析|原因|A\.|选项|来源)|$)/s);
  if (qMatch) question = qMatch[1].replace(/\n/g, ' ').trim();

  const wMatch = cleaned.match(/(?:我[的的]?答案|错误答案|我的选择|选了|选错|选了)[：:]\s*(.+?)(?=\n|$)/);
  if (wMatch) wrong = wMatch[1].trim();

  const cMatch = cleaned.match(/(?:正确答案|正解|答案)[：:]\s*(.+?)(?=\n|$)/);
  if (cMatch) correct = cMatch[1].trim();

  const rMatch = cleaned.match(/(?:解析|错误原因|原因)[：:]\s*(.+?)(?=\n|$)/s);
  if (rMatch) reason = rMatch[1].trim();

  // Pattern 2: 裸文本 — 没有标签时按常见格式智能拆分
  if (!question) {
    // Split by newlines, first non-empty meaningful line is the question
    const lines = cleaned.split(/\n/).map(l => l.trim()).filter(Boolean);
    const opts = /^[A-D][\.\、\)）]/;
    let questionLines = [];

    for (const line of lines) {
      if (opts.test(line)) break;
      if (/^(解析|来源|答案|正确|错误)/.test(line)) break;
      questionLines.push(line);
    }
    question = questionLines.join(' ') || lines[0] || '';
  }

  // 找选项中的答案标记
  if (!wrong) {
    const wrongMark = cleaned.match(/[A-D](?=[\s]*[（\(]?[错误我选的]|[×✗✘])/);
    if (wrongMark) wrong = wrongMark[0];
    if (!wrong) {
      const wrongMark2 = cleaned.match(/(?:选了|选了答案|选错)[：:\s]*([A-D])/);
      if (wrongMark2) wrong = wrongMark2[1];
    }
  }
  if (!correct) {
    const correctMark = cleaned.match(/[A-D](?=[\s]*[（\(]?[对正√✓✔])/);
    if (correctMark) correct = correctMark[0];
    if (!correct) {
      const correctMark2 = cleaned.match(/(?:正确|答案|正解)[：:\s]*([A-D])/);
      if (correctMark2) correct = correctMark2[1];
    }
  }

  // Auto-detect subject
  const subject = document.getElementById('quickSubject').value || autoDetectSubject(raw);

  // Fill form
  document.getElementById('formSubject').value = subject || '';
  document.getElementById('formQuestion').value = question || '';
  document.getElementById('formWrong').value = wrong || '';
  document.getElementById('formCorrect').value = correct || '';
  document.getElementById('formReason').value = reason || '';
  document.getElementById('formMastered').value = '0';

  // Switch to manual panel to let user review and save
  switchTab('manual');

  // Scroll to top of modal to let user see the result
  document.querySelector('.modal').scrollTop = 0;
}

function saveRecord() {
  const id = document.getElementById('editId').value;
  const data = {
    id: id || getId(),
    subject: document.getElementById('formSubject').value,
    question: document.getElementById('formQuestion').value,
    wrongAnswer: document.getElementById('formWrong').value,
    correctAnswer: document.getElementById('formCorrect').value,
    reason: document.getElementById('formReason').value,
    mastered: document.getElementById('formMastered').value === '1',
    createdAt: id ? (records.find(r => r.id === id)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    reviewCount: id ? (records.find(r => r.id === id)?.reviewCount || 0) : 0,
    lastReviewed: id ? (records.find(r => r.id === id)?.lastReviewed || null) : null,
  };

  if (id) {
    const idx = records.findIndex(r => r.id === id);
    if (idx !== -1) records[idx] = data;
  } else {
    records.unshift(data);
  }

  save();
  closeModal();
  renderAll();
}

function toggleMastered(id) {
  const r = records.find(e => e.id === id);
  if (r) {
    r.mastered = !r.mastered;
    r.updatedAt = new Date().toISOString();
    if (r.mastered) {
      r.reviewCount++;
      r.lastReviewed = new Date().toISOString();
    }
    save();
    renderAll();
  }
}

function markReviewed(id) {
  const r = records.find(e => e.id === id);
  if (r) {
    r.reviewCount++;
    r.lastReviewed = new Date().toISOString();
    r.updatedAt = new Date().toISOString();
    r.nextReview = new Date(Date.now() + 3 * 86400000).toISOString();
    save();
    renderAll();
  }
}

function getReviewStatus(r) {
  if (r.mastered) return 'ok';
  if (r.nextReview) {
    const until = (new Date(r.nextReview).getTime() - Date.now()) / 86400000;
    if (until < 0) return 'overdue';
    if (until < 1) return 'soon';
    return 'ok';
  }
  if (!r.lastReviewed) return 'overdue';
  const daysSince = (Date.now() - new Date(r.lastReviewed).getTime()) / 86400000;
  if (daysSince > 7) return 'overdue';
  if (daysSince > 3) return 'soon';
  return 'ok';
}

function getReviewLabel(r) {
  if (r.mastered) return '已掌握 ✓';
  if (r.nextReview) {
    const until = Math.ceil((new Date(r.nextReview).getTime() - Date.now()) / 86400000);
    if (until < 0) return '逾期 ' + Math.abs(until) + ' 天';
    if (until === 0) return '今天复习';
    if (until === 1) return '明天复习';
    return until + ' 天后复习';
  }
  const status = getReviewStatus(r);
  if (status === 'overdue') return '逾期 · 第' + r.reviewCount + '次';
  if (status === 'soon') return '临近 · 第' + r.reviewCount + '次';
  return '正常 · 第' + r.reviewCount + '次';
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filterSubject = document.getElementById('filterSubject').value;
  const filterStatus = document.getElementById('filterStatus').value;

  let filtered = records;

  if (search) {
    filtered = filtered.filter(r =>
      r.question.toLowerCase().includes(search) ||
      r.wrongAnswer.toLowerCase().includes(search) ||
      r.correctAnswer.toLowerCase().includes(search) ||
      r.reason.toLowerCase().includes(search) ||
      r.subject.toLowerCase().includes(search)
    );
  }

  if (filterSubject !== 'all') {
    filtered = filtered.filter(r => r.subject === filterSubject);
  }

  if (filterStatus === 'mastered') {
    filtered = filtered.filter(r => r.mastered);
  } else if (filterStatus === 'unmastered') {
    filtered = filtered.filter(r => !r.mastered);
  } else if (filterStatus === 'overdue') {
    filtered = filtered.filter(r => !r.mastered && getReviewStatus(r) === 'overdue');
  }

  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = records.length === 0 ? 'block' : 'block';
    if (records.length > 0) {
      emptyState.querySelector('p').textContent = '没有匹配的错题';
    } else {
      emptyState.querySelector('p').textContent = '还没有错题记录';
    }
  } else {
    emptyState.style.display = 'none';
  }

  tbody.innerHTML = filtered.map(r => {
    const status = getReviewStatus(r);
    const label = getReviewLabel(r);
    let reviewHtml = '';
    if (r.mastered) {
      reviewHtml = '<span class="review-badge ok">' + label + '</span>';
    } else if (status === 'overdue') {
      reviewHtml = '<span class="review-badge overdue">' + label + '</span>';
    } else if (status === 'soon') {
      reviewHtml = '<span class="review-badge soon">' + label + '</span>';
    } else {
      reviewHtml = '<span class="review-badge ok">' + label + '</span>';
    }

    const rowClass = r.mastered ? 'mastered' : '';
    const subjDisplay = r.subject || '未分类';
    const createdAt = new Date(r.createdAt).toLocaleDateString('zh-CN');

    return `<tr class="${rowClass}">
      <td><span class="subj-tag">${escapeHtml(subjDisplay)}</span></td>
      <td title="创建于 ${createdAt}">${escapeHtml(r.question || '-')}</td>
      <td>${escapeHtml(r.wrongAnswer || '-')}</td>
      <td style="color:#fff;">${escapeHtml(r.correctAnswer || '-')}</td>
      <td style="color:var(--text-dim);">${escapeHtml(r.reason || '-')}</td>
      <td>${reviewHtml}</td>
      <td>
        <div class="actions-cell">
          <button class="btn btn-sm" onclick="markReviewed('${r.id}')" title="标记已复习">✓</button>
          <button class="btn btn-sm" onclick="openModal('${r.id}')">编辑</button>
          <button class="btn btn-sm" onclick="toggleMastered('${r.id}')">${r.mastered ? '恢复' : '掌握'}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteRecord('${r.id}')">删</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  updateStats();
}

function updateStats() {
  document.getElementById('statTotal').textContent = records.length;
  document.getElementById('statMastered').textContent = records.filter(r => r.mastered).length;
  document.getElementById('statUnreviewed').textContent = records.filter(r => !r.mastered).length;
  document.getElementById('statOverdue').textContent = records.filter(r => !r.mastered && getReviewStatus(r) === 'overdue').length;
}

function renderAll() {
  renderTable();
}

function exportData() {
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '错题本备份_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      if (!confirm(`将导入 ${data.length} 条记录，与现有 ${records.length} 条合并。确认？`)) return;
      const merged = [...data, ...records];
      // 去重（按id）
      const seen = new Set();
      records = merged.filter(r => {
        if (seen.has(r.id)) return false;
        seen.add(r.id);
        return true;
      });
      save();
      renderAll();
      alert('导入完成');
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// Modal click-outside close
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});


// ====== Quiz Mode ======
let quizState = { active: false, currentIndex: 0, answers: {}, questions: [] };
let quizMode = 'full'; // 'full' | 'daily'

function startQuiz() {
  // If in daily mode, warn before switching
  if (quizState.active && quizMode === 'daily') {
    const answered = Object.keys(quizState.answers).length;
    if (answered > 0 && !confirm(`当前每日20题已有 ${answered} 题作答记录，切换将丢失进度。\n\n确定切换到全部刷题模式？`)) return;
    clearDailySession();
  }

  const withOptions = records.filter(r => r.options && r.options.length > 0);
  if (withOptions.length === 0) { alert('还没有带选项的题目，请先添加带选项的错题。'); return; }

  const currentIds = withOptions.map(q => q.id).sort().join(',');
  const saved = loadQuizSession();
  let resumeIdx = 0, resumeAnswers = {};

  if (saved && saved.questionIds) {
    const savedIds = [...saved.questionIds].sort().join(',');
    if (savedIds === currentIds) {
      const answeredCount = Object.keys(saved.answers).length;
      if (answeredCount > 0 && confirm(`检测到上次刷题进度（已答 ${answeredCount} 题，进度 ${saved.currentIndex + 1}/${saved.questionIds.length}）。\n\n是否继续上次的进度？`)) {
        resumeIdx = saved.currentIndex;
        resumeAnswers = saved.answers;
      }
    }
  }

  quizMode = 'full';
  quizState = { active: true, currentIndex: resumeIdx, answers: resumeAnswers, questions: withOptions };
  document.querySelector('.table-wrap').classList.add('hidden');
  document.querySelector('.toolbar').classList.add('hidden');
  document.querySelector('.stats-row').classList.add('hidden');
  document.getElementById('quizPanel').classList.remove('hidden');
  document.getElementById('quizModeBtn').textContent = '退出刷题';
  document.getElementById('dailyQuizBtn').textContent = '每日20题';
  renderQuizQuestion();
  saveQuizSession();
}

function startDailyQuiz() {
  const withOptions = records.filter(r => r.options && r.options.length > 0);
  if (withOptions.length === 0) { alert('还没有带选项的题目，请先添加带选项的错题。'); return; }

  const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  const saved = loadDailySession();

  // If already completed today
  if (saved && saved.date === today && saved.completed) {
    if (!confirm('今天的20题已经完成！\n\n是否重新开始一轮？')) return;
  }

  let dayQuestions, resumeIdx = 0, resumeAnswers = {};

  // Resume today's session if same date and same question set
  if (saved && saved.date === today && saved.questionIds && !saved.completed) {
    const savedIds = [...saved.questionIds].sort().join(',');
    // Check if these questions still exist
    const existingIds = saved.questionIds.filter(id => records.some(r => r.id === id));
    if (existingIds.length === saved.questionIds.length) {
      const answeredCount = Object.keys(saved.answers).length;
      if (answeredCount > 0 && confirm(`检测到今天未完成的每日20题（已答 ${answeredCount}/20，进度 ${saved.currentIndex + 1}/20）。\n\n是否继续？`)) {
        dayQuestions = records.filter(r => saved.questionIds.includes(r.id));
        resumeIdx = saved.currentIndex;
        resumeAnswers = saved.answers;
      }
    }
  }

  // Pick new 20 questions if not resuming
  if (!dayQuestions) {
    clearDailySession();
    const now = new Date();
    // Priority 1: due for review (nextReview <= now)
    const due = withOptions.filter(r => r.nextReview && new Date(r.nextReview) <= now);
    // Priority 2: never reviewed or unmastered
    const fresh = withOptions.filter(r => !r.nextReview || r.reviewCount === 0);
    const unmastered = withOptions.filter(r => !r.mastered);
    // Combine: due first, then fresh, then unmastered, then the rest
    const seen = new Set();
    const ranked = [];
    for (const r of [...due, ...fresh, ...unmastered, ...withOptions]) {
      if (!seen.has(r.id)) { seen.add(r.id); ranked.push(r); }
    }
    // Take 20, shuffle for variety
    const picked = ranked.slice(0, 20);
    for (let i = picked.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [picked[i], picked[j]] = [picked[j], picked[i]];
    }
    dayQuestions = picked;
  }

  quizMode = 'daily';
  quizState = { active: true, currentIndex: resumeIdx, answers: resumeAnswers, questions: dayQuestions };
  document.querySelector('.table-wrap').classList.add('hidden');
  document.querySelector('.toolbar').classList.add('hidden');
  document.querySelector('.stats-row').classList.add('hidden');
  document.getElementById('quizPanel').classList.remove('hidden');
  document.getElementById('quizModeBtn').textContent = '刷题模式';
  document.getElementById('dailyQuizBtn').textContent = '退出每日20题';
  renderQuizQuestion();
  saveQuizSession();
}

function exitQuiz() {
  quizState.active = false;
  document.querySelector('.table-wrap').classList.remove('hidden');
  document.querySelector('.toolbar').classList.remove('hidden');
  document.querySelector('.stats-row').classList.remove('hidden');
  document.getElementById('quizPanel').classList.add('hidden');
  document.getElementById('quizModeBtn').textContent = '刷题模式';
  document.getElementById('dailyQuizBtn').textContent = '每日20题';
  updateStats();
  renderTable();
}

function renderQuizQuestion() {
  const { currentIndex, questions, answers } = quizState;
  const total = questions.length;
  const q = questions[currentIndex];
  const answered = answers[q.id] !== undefined;
  const letters = ['A', 'B', 'C', 'D'];
  const userAnswer = answers[q.id];

  document.getElementById('quizModeTag').style.display = quizMode === 'daily' ? '' : 'none';
  document.getElementById('quizProgressFill').style.width = ((currentIndex + 1) / total * 100) + '%';
  document.getElementById('quizCounter').textContent = `${currentIndex + 1}/${total}`;
  document.getElementById('quizPrevBtn').disabled = currentIndex === 0;

  const nextBtn = document.getElementById('quizNextBtn');
  nextBtn.style.display = '';
  if (currentIndex >= total - 1) {
    nextBtn.textContent = '查看成绩';
    nextBtn.onclick = showQuizSummary;
  } else {
    nextBtn.textContent = '下一题';
    nextBtn.onclick = nextQuestion;
  }

  let optionsHtml = q.options.map((opt, i) => {
    let cls = '';
    if (answered) {
      cls = 'revealed';
      if (i === q.correctIndex) cls += ' correct-choice';
      else if (i === userAnswer && i !== q.correctIndex) cls += ' wrong-choice';
      else cls += ' dimmed';
    }
    return `<div class="quiz-option ${cls}" onclick="${answered ? '' : `selectOption(${i})`}">
      <span class="opt-letter">${letters[i]}</span>
      <span>${escapeHtml(opt.replace(/^[A-D][\\.\\、\\)）\\s]+/, ''))}</span>
    </div>`;
  }).join('');

  let feedbackHtml = '';
  if (answered) {
    const isCorrect = userAnswer === q.correctIndex;
    const record = records.find(r => r.id === q.id);
    const streak = record ? (record.correctStreak || 0) : 0;
    const streakMsg = isCorrect && streak > 0 ? ` · 连续正确 ${streak}/10` : '';
    const masteredMsg = isCorrect && record && record.mastered && streak >= 10 ? ' 🎉 已自动掌握！' : '';
    feedbackHtml = `<div class="quiz-feedback ${isCorrect ? 'correct' : 'wrong'}">
      <div class="fb-title">${isCorrect ? '✓ 回答正确！' + streakMsg + masteredMsg : '✗ 回答错误 · 连续正确已重置'}</div>
      <div>正确答案：<strong>${letters[q.correctIndex]}</strong></div>
      ${q.reason ? `<div class="fb-reason">${escapeHtml(q.reason)}</div>` : ''}
    </div>`;
  }

  document.getElementById('quizContent').innerHTML = `<div class="quiz-card">
    <div class="quiz-subject-tag">${escapeHtml(q.subject || '未分类')}</div>
    <div class="quiz-question-text">${escapeHtml(q.question)}</div>
    <div class="quiz-options">${optionsHtml}</div>
    ${feedbackHtml}
  </div>`;
}

function selectOption(index) {
  const { currentIndex, questions } = quizState;
  const q = questions[currentIndex];
  if (quizState.answers[q.id] !== undefined) return;
  quizState.answers[q.id] = index;
  const record = records.find(r => r.id === q.id);
  if (record) {
    record.reviewCount++;
    record.lastReviewed = new Date().toISOString();
    record.updatedAt = new Date().toISOString();
    const now = Date.now();
    const isCorrect = index === q.correctIndex;
    if (index !== q.correctIndex) {
      record.wrongAnswer = ['A', 'B', 'C', 'D'][index];
      record.correctStreak = 0;
    } else {
      record.correctStreak = (record.correctStreak || 0) + 1;
    }
    record.nextReview = new Date(now + (isCorrect ? 5 : 1) * 86400000).toISOString();
    if (record.correctStreak >= 10) {
      record.mastered = true;
    }
  }
  save();
  saveQuizSession();
  renderQuizQuestion();
}

function nextQuestion() {
  if (quizState.currentIndex < quizState.questions.length - 1) {
    quizState.currentIndex++;
    renderQuizQuestion();
    saveQuizSession();
  }
}

function prevQuestion() {
  if (quizState.currentIndex > 0) {
    quizState.currentIndex--;
    renderQuizQuestion();
    saveQuizSession();
  }
}

function showQuizSummary() {
  if (quizMode === 'daily') {
    // Mark daily session as completed
    try {
      const raw = localStorage.getItem(DAILY_SESSION_KEY);
      if (raw) {
        const session = JSON.parse(raw);
        session.completed = true;
        localStorage.setItem(DAILY_SESSION_KEY, JSON.stringify(session));
      }
    } catch {}
  } else {
    clearQuizSession();
  }
  const { questions, answers } = quizState;
  const total = questions.length;
  const answered = questions.filter(q => answers[q.id] !== undefined).length;
  const correct = questions.filter(q => answers[q.id] === q.correctIndex).length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  let scoreClass = pct >= 90 ? 'perfect' : (pct >= 60 ? 'good' : '');
  const modeLabel = quizMode === 'daily' ? '每日20题' : '刷题';
  document.getElementById('quizProgressFill').style.width = '100%';
  document.getElementById('quizCounter').textContent = '完成';
  document.getElementById('quizPrevBtn').disabled = true;
  document.getElementById('quizNextBtn').style.display = 'none';
  document.getElementById('quizContent').innerHTML = `<div class="quiz-summary">
    <div class="score ${scoreClass}">${correct}/${total}</div>
    <div class="detail">正确率 ${pct}%</div>
    <p style="color:var(--text-dim);font-size:0.85rem;">${pct >= 90 ? '太厉害了，掌握得很好！' : (pct >= 60 ? '继续加油，还有提升空间！' : '别灰心，多复习几次就好了！')}</p>
    <div style="margin-top:20px;display:flex;gap:12px;justify-content:center;">
      <button class="btn" onclick="retryWrongQuestions()">复习错题</button>
      <button class="btn btn-primary" onclick="restartQuiz()">${quizMode === 'daily' ? '重新选20题' : '重新刷题'}</button>
    </div>
  </div>`;
}

function retryWrongQuestions() {
  if (quizMode === 'daily') { clearDailySession(); } else { clearQuizSession(); }
  const { questions, answers } = quizState;
  const wrong = questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.correctIndex);
  if (wrong.length === 0) { alert('没有错题，太棒了！'); return; }
  quizState.questions = wrong;
  quizState.currentIndex = 0;
  quizState.answers = {};
  renderQuizQuestion();
}

function restartQuiz() {
  if (quizMode === 'daily') {
    clearDailySession();
    startDailyQuiz();
    return;
  }
  clearQuizSession();
  quizState.currentIndex = 0;
  quizState.answers = {};
  quizState.questions = records.filter(r => r.options && r.options.length > 0);
  renderQuizQuestion();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Init
loadSyncCfg();
load();
renderAll();
updateEnrichBtn();

// Background: pull from cloud if configured
if (isSyncReady()) {
  setSyncStatus('on');
  pullAndMerge();
} else {
  setSyncStatus('off');
  updateEnrichBtn();
}
</script>
