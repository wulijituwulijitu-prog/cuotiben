<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词语辨析 · 言语理解</title>
<style>
  :root {
    --bg: #0a0e14; --surface: #131a24; --border: #1e2a3a;
    --accent: #00d4aa; --danger: #ff6b6b; --warn: #ffc048;
    --text: #c8d6e5; --text-dim: #6b7d95; --purple: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 24px 16px; }

  /* Topbar */
  .topbar { text-align: center; margin-bottom: 20px; }
  .topbar h1 { font-size: 1.3rem; color: #fff; letter-spacing: 1px; }
  .topbar h1 span { color: var(--accent); }

  /* Sync */
  .sync-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; }
  .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sync-dot.off { background: #555; }
  .sync-dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .sync-dot.syncing { background: var(--warn); animation: syncPulse 0.8s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 10px; text-align: center;
  }
  .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #fff; }
  .stat-card .num.accent { color: var(--accent); }
  .stat-card .num.warn { color: var(--warn); }
  .stat-card .num.purple { color: var(--purple); }
  .stat-card .lbl { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 20px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 10px; text-align: center; font-size: 0.85rem; font-weight: 500;
    background: var(--bg); color: var(--text-dim); border: none; cursor: pointer; transition: all 0.25s;
  }
  .tab + .tab { border-left: 1px solid var(--border); }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: #0a0e14; font-weight: 600; }

  /* Buttons */
  .btn {
    padding: 8px 18px; border-radius: 8px; font-size: 0.82rem; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); transition: all 0.25s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(0,212,170,0.12); }
  .btn-primary { background: var(--accent); color: #0a0e14; border-color: var(--accent); font-weight: 600; }
  .btn-sm { padding: 5px 12px; font-size: 0.75rem; border-radius: 6px; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); box-shadow: 0 0 14px rgba(255,107,107,0.2); }

  /* Flashcard */
  .flashcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; margin-bottom: 16px; cursor: pointer; transition: all 0.4s;
    min-height: 200px; position: relative; overflow: hidden;
    user-select: none;
  }
  .flashcard:hover { border-color: var(--accent); }
  .flashcard.flipped { cursor: default; }
  .flashcard .card-inner { transition: transform 0.5s; }
  .flashcard .front, .flashcard .back { transition: opacity 0.4s; }

  .word-pair {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .word-item {
    text-align: center; padding: 12px 24px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px; min-width: 100px;
  }
  .word-item .word { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 2px; }
  .word-item .meaning { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }
  .word-vs { font-size: 1.2rem; color: var(--accent); font-weight: 700; }

  .diff-box {
    margin-top: 16px; padding: 16px; background: rgba(167,139,250,0.06);
    border: 1px solid rgba(167,139,250,0.2); border-radius: 10px;
    font-size: 0.88rem; color: var(--text); line-height: 1.8;
  }
  .diff-box .label { color: var(--purple); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

  .tap-hint { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 12px; }

  /* Quiz */
  .quiz-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; margin-bottom: 16px;
  }
  .quiz-counter-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  }
  .quiz-progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .quiz-progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .quiz-num { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }

  .quiz-sentence {
    font-size: 1.1rem; line-height: 2; color: #e8edf3; margin-bottom: 24px; padding: 20px;
    background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
  }
  .quiz-sentence .blank {
    display: inline-block; min-width: 80px; border-bottom: 2px dashed var(--accent);
    color: var(--accent); margin: 0 4px; text-align: center;
  }

  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt {
    padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px;
    background: var(--bg); cursor: pointer; font-size: 1rem; font-weight: 600;
    transition: all 0.2s; text-align: center; letter-spacing: 1px; color: var(--text);
  }
  .quiz-opt:hover:not(.revealed) { border-color: var(--accent); background: rgba(0,212,170,0.04); }
  .quiz-opt.revealed { cursor: default; }
  .quiz-opt.revealed.correct { border-color: var(--accent); background: rgba(0,212,170,0.1); color: var(--accent); }
  .quiz-opt.revealed.wrong { border-color: var(--danger); background: rgba(255,107,107,0.08); color: var(--danger); }

  .quiz-feedback {
    margin-top: 16px; padding: 14px 16px; border-radius: 10px; font-size: 0.85rem; line-height: 1.7;
  }
  .quiz-feedback.correct { background: rgba(0,212,170,0.06); border: 1px solid rgba(0,212,170,0.2); }
  .quiz-feedback.wrong { background: rgba(255,107,107,0.05); border: 1px solid rgba(255,107,107,0.18); }

  .quiz-nav { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 12px; }

  /* Daily goal bar */
  .daily-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .daily-bar .fire { font-size: 1.3rem; }
  .daily-bar-fill {
    flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .daily-bar-inner { height: 100%; background: var(--warn); border-radius: 4px; transition: width 0.4s; }
  .daily-bar .txt { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }

  /* Filter */
  .filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-row select, .filter-row input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; color: var(--text); font-size: 0.85rem; outline: none;
  }
  .filter-row input { flex: 1; min-width: 150px; }
  .filter-row input:focus, .filter-row select:focus { border-color: var(--accent); }

  /* Browse list */
  .browse-list { display: flex; flex-direction: column; gap: 10px; }
  .browse-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; cursor: pointer; transition: all 0.2s;
  }
  .browse-item:hover { border-color: var(--accent); }
  .browse-item .bw-words { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .browse-item .bw-words .vs { color: var(--accent); margin: 0 8px; }
  .browse-item .bw-diff { font-size: 0.8rem; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
  .browse-item .bw-tag {
    display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 0.68rem;
    margin-left: 8px; font-weight: 500;
  }
  .browse-item .bw-tag.idiom { background: rgba(167,139,250,0.15); color: var(--purple); }
  .browse-item .bw-tag.word { background: rgba(0,212,170,0.12); color: var(--accent); }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .flashcard, .quiz-card { padding: 20px; }
    .word-item .word { font-size: 1.2rem; }
    .quiz-sentence { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="container">

  <div class="topbar">
    <h1><span>词语辨析</span> · 言语理解与表达</h1>
    <button class="btn sync-btn" onclick="toggleSyncSettings()" id="syncBtn" title="云同步">
      <span class="sync-dot off" id="syncDot"></span>云同步
    </button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="num" id="sTotal">0</div><div class="lbl">总词条</div></div>
    <div class="stat-card"><div class="num accent" id="sMastered">0</div><div class="lbl">已掌握</div></div>
    <div class="stat-card"><div class="num warn" id="sStreak">0</div><div class="lbl">连续天数</div></div>
    <div class="stat-card"><div class="num purple" id="sToday">0</div><div class="lbl">今日已刷</div></div>
    <div class="stat-card"><div class="num" id="sYesterday">0</div><div class="lbl">昨日已刷</div></div>
  </div>

  <div class="daily-bar" id="dailyBar">
    <span class="fire">🔥</span>
    <div class="daily-bar-fill"><div class="daily-bar-inner" id="dailyFill" style="width:0%"></div></div>
    <span class="txt" id="dailyTxt">今日目标 0/20</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchPanel('browse')">📖 浏览词条</button>
    <button class="tab" onclick="switchPanel('quiz')">🎯 刷题模式</button>
  </div>

  <!-- Browse panel -->
  <div id="browsePanel">
    <div class="filter-row">
      <input type="text" id="browseSearch" placeholder="搜索词语…" oninput="renderBrowse()">
      <select id="browseType" onchange="renderBrowse()">
        <option value="all">全部</option>
        <option value="idiom">成语辨析</option>
        <option value="word">词语辨析</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="openBatchModal()">+ 批量添加</button>
    </div>
    <div class="browse-list" id="browseList"></div>
  </div>

  <!-- Quiz panel -->
  <div class="hidden" id="quizPanel">
    <div class="quiz-card" id="quizCard"></div>
    <div class="quiz-nav" id="quizNav">
      <button class="btn" onclick="prevQuiz()">上一题</button>
      <button class="btn btn-primary" onclick="nextQuiz()">下一题</button>
    </div>
  </div>

  <!-- Flashcard detail modal -->
  <div class="hidden" id="cardOverlay" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);" onclick="if(event.target===this)closeCard()">
    <div id="cardContent" style="width:90%;max-width:600px;"></div>
  </div>

</div>

<!-- Sync Settings Modal -->
<div class="modal-overlay hidden" id="syncOverlay" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:90%;max-width:440px;">
    <h2 style="color:#fff;font-size:1.15rem;margin-bottom:20px;">云同步设置</h2>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:20px;line-height:1.7;">
      使用 GitHub Gist 存储数据，手机电脑自动同步。<br>
      与错题本共用一个 Token，直接粘贴即可。
    </p>
    <div style="margin-bottom:18px;">
      <label style="display:block;font-size:0.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">GitHub Token</label>
      <input type="password" id="syncToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:0.9rem;outline:none;">
    </div>
    <div style="margin-bottom:18px;">
      <label style="display:block;font-size:0.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Gist ID <span style="color:var(--text-dim);font-weight:400;">（自动获取）</span></label>
      <input type="text" id="syncGistId" placeholder="连接成功后自动填充" readonly style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:0.9rem;outline:none;">
    </div>
    <div id="syncMsg" style="font-size:0.8rem;margin-bottom:16px;display:none;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-danger" onclick="disconnectSync()" id="disconnectBtn" style="display:none;">断开同步</button>
      <button class="btn" onclick="closeSyncSettings()">取消</button>
      <button class="btn btn-primary" onclick="connectSync()" id="connectBtn">连接并同步</button>
    </div>
  </div>
</div>

<!-- Batch Import Modal -->
<div class="modal-overlay hidden" id="batchOverlay" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;">
    <h2 style="color:#fff;font-size:1.1rem;margin-bottom:16px;">批量添加词条</h2>
    <p style="color:var(--text-dim);font-size:0.78rem;margin-bottom:14px;line-height:1.7;">
      格式：每组用空行隔开。<br>
      每组至少包含两个词语及其意思，可选「辨析」和「例题」。<br><br>
      例：<br>
      <code style="background:var(--bg);padding:4px 8px;border-radius:4px;display:block;white-space:pre-wrap;font-size:0.75rem;">词A：意思A
词B：意思B
辨析：两者的区别说明
例题：这是一道___的例题。
答案：词A</code>
    </p>
    <div class="form-group" style="margin-bottom:14px;">
      <label style="display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:6px;">粘贴词条</label>
      <textarea id="batchText" rows="14" placeholder="按上面的格式粘贴…" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:0.85rem;outline:none;font-family:inherit;resize:vertical;"></textarea>
    </div>
    <div id="batchMsg" style="font-size:0.8rem;margin-bottom:12px;display:none;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn" onclick="closeBatchModal()">取消</button>
      <button class="btn btn-primary" onclick="execBatchImport()">解析并导入</button>
    </div>
  </div>
</div>

<script>


const STORAGE_KEY = 'cidian_data_v2';
const DAILY_GOAL = 100;

let entries = [];
let quizState = { index: 0, answers: {}, questions: [] };
let currentPanel = 'browse';

// ====== Cloud Sync (GitHub Gist) ======
const SYNC_CFG_KEY = 'cidian_sync_config_v1';
let syncCfg = { token: '', gistId: '' };

function loadSyncCfg() {
  try { const raw = localStorage.getItem(SYNC_CFG_KEY); if (raw) syncCfg = JSON.parse(raw); } catch { syncCfg = { token: '', gistId: '' }; }
}
function saveSyncCfg() { try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); } catch {} }
function isSyncReady() { return !!(syncCfg.token && syncCfg.gistId); }
function setSyncStatus(state) { const dot = document.getElementById('syncDot'); if (dot) dot.className = 'sync-dot ' + state; }

function toggleSyncSettings() {
  const overlay = document.getElementById('syncOverlay');
  if (overlay.classList.contains('hidden')) {
    loadSyncCfg();
    document.getElementById('syncToken').value = syncCfg.token || '';
    document.getElementById('syncGistId').value = syncCfg.gistId || '';
    document.getElementById('syncMsg').style.display = 'none';
    if (isSyncReady()) {
      document.getElementById('connectBtn').textContent = '保存并同步';
      document.getElementById('disconnectBtn').style.display = '';
    } else {
      document.getElementById('connectBtn').textContent = '连接并同步';
      document.getElementById('disconnectBtn').style.display = 'none';
    }
    overlay.classList.remove('hidden');
  } else {
    closeSyncSettings();
  }
}
function closeSyncSettings() { document.getElementById('syncOverlay').classList.add('hidden'); }
function showSyncMsg(msg, color) {
  const el = document.getElementById('syncMsg'); el.textContent = msg; el.style.display = 'block'; el.style.color = color || 'var(--text-dim)';
}

async function connectSync() {
  const token = document.getElementById('syncToken').value.trim();
  if (!token) { showSyncMsg('请输入 GitHub Token', 'var(--danger)'); return; }
  showSyncMsg('正在验证连接…', 'var(--warn)'); setSyncStatus('syncing');
  try {
    const userResp = await fetch('https://api.github.com/user', { headers: { Authorization: 'token ' + token } });
    if (!userResp.ok) { showSyncMsg('Token 无效，请检查后重试', 'var(--danger)'); setSyncStatus('error'); return; }
    const user = await userResp.json();

    let gistId = document.getElementById('syncGistId').value.trim() || syncCfg.gistId;
    if (gistId) {
      const testResp = await fetch('https://api.github.com/gists/' + gistId, { headers: { Authorization: 'token ' + token } });
      if (!testResp.ok) gistId = '';
    }
    if (!gistId) {
      showSyncMsg('正在查找已有同步数据…', 'var(--warn)');
      const listResp = await fetch('https://api.github.com/gists?per_page=100', { headers: { Authorization: 'token ' + token } });
      if (listResp.ok) {
        const gists = await listResp.json();
        for (const g of gists) {
          if (g.description === '词语辨析数据 · 云同步' && g.files && g.files['cidian.json']) { gistId = g.id; break; }
        }
      }
      if (!gistId) {
        const createResp = await fetch('https://api.github.com/gists', {
          method: 'POST', headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ description: '词语辨析数据 · 云同步', public: false, files: { 'cidian.json': { content: JSON.stringify(entries.length > 0 ? entries : getDefaultData(), null, 2) } } })
        });
        if (!createResp.ok) { const err = await createResp.json(); showSyncMsg('创建 Gist 失败: ' + (err.message || createResp.status), 'var(--danger)'); setSyncStatus('error'); return; }
        const gist = await createResp.json(); gistId = gist.id;
      }
    }
    const isNewGist = !syncCfg.gistId;
    syncCfg = { token: token, gistId: gistId }; saveSyncCfg();
    document.getElementById('syncGistId').value = gistId;
    document.getElementById('connectBtn').textContent = '保存并同步';
    document.getElementById('disconnectBtn').style.display = '';
    setSyncStatus('on');
    showSyncMsg('已连接 · GitHub: ' + user.login + ' · 数据已同步', 'var(--accent)');
    if (isNewGist) { await pushToGist(); } else { await pullAndMerge(); }
  } catch(e) { showSyncMsg('网络错误，请检查网络后重试', 'var(--danger)'); setSyncStatus('error'); }
}

function disconnectSync() {
  if (!confirm('断开云同步？本地数据不会丢失。')) return;
  syncCfg = { token: '', gistId: '' }; saveSyncCfg();
  document.getElementById('syncToken').value = ''; document.getElementById('syncGistId').value = '';
  document.getElementById('connectBtn').textContent = '连接并同步'; document.getElementById('disconnectBtn').style.display = 'none';
  document.getElementById('syncMsg').style.display = 'none'; setSyncStatus('off');
}

async function pushToGist() {
  if (!isSyncReady()) return false;
  try {
    setSyncStatus('syncing');
    const resp = await fetch('https://api.github.com/gists/' + syncCfg.gistId, {
      method: 'PATCH', headers: { Authorization: 'token ' + syncCfg.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'cidian.json': { content: JSON.stringify(entries, null, 2) } } })
    });
    if (resp.ok) { setSyncStatus('on'); return true; }
    setSyncStatus('error'); return false;
  } catch { setSyncStatus('error'); return false; }
}

async function pullFromGist() {
  if (!isSyncReady()) return null;
  try {
    setSyncStatus('syncing');
    const resp = await fetch('https://api.github.com/gists/' + syncCfg.gistId, { headers: { Authorization: 'token ' + syncCfg.token } });
    if (!resp.ok) { setSyncStatus('error'); return null; }
    const gist = await resp.json(); const file = gist.files['cidian.json'];
    if (!file || !file.content) { setSyncStatus('on'); return null; }
    const data = JSON.parse(file.content);
    if (!Array.isArray(data)) { setSyncStatus('error'); return null; }
    setSyncStatus('on'); return data;
  } catch { setSyncStatus('error'); return null; }
}

async function pullAndMerge() {
  const gistData = await pullFromGist();
  if (gistData && gistData.length > 0) {
    const gistIds = new Set(gistData.map(r => r.id));
    const localOnly = entries.filter(r => !gistIds.has(r.id));
    entries = [...gistData, ...localOnly];
    try { save(); } catch {} updateStats(); renderBrowse();
  } else if (gistData && gistData.length === 0 && entries.length > 0) {
    await pushToGist();
  }
}

    {id:"i31",type:"idiom",words:["无可厚非","无可讳言"],meanings:["不可过分指责","没什么可避讳的"],difference:"无可厚非：厚=过分。有缺点但可以理解，不必过分指责。无可讳言：讳=避讳。没什么可避讳的，可以直说。前者是「可原谅」，后者是「可直说」。",question:"年轻人追求时尚___，只要不过度消费就好。",options:["无可厚非","无可讳言"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i32",type:"idiom",words:["不翼而飞","不胫而走"],meanings:["东西突然不见了","消息迅速传播"],difference:"不翼而飞：没有翅膀却飞走了。比喻东西突然丢失。不胫而走：胫=小腿。没有腿却能跑。比喻消息等迅速传播。前者指「物品消失」，后者指「消息传播」。",question:"好消息___，很快就传遍了整个社区。",options:["不翼而飞","不胫而走"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i33",type:"idiom",words:["侧目而视","刮目相看"],meanings:["斜着眼睛看（畏惧/愤恨）","用新的眼光看待（进步大）"],difference:"侧目而视：侧=斜着。斜着眼睛看人，形容畏惧或愤恨不满。刮目相看：擦亮眼睛看。指别人已有进步，不能再用老眼光看。前者是「畏惧/不满」，后者是「重新审视」。",question:"他这半年的进步有目共睹，让大家___。",options:["侧目而视","刮目相看"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i34",type:"idiom",words:["鞭长莫及","望尘莫及"],meanings:["力量达不到（距离远管不了）","远远落后追不上"],difference:"鞭长莫及：鞭子虽长但打不到马肚子。比喻距离太远管不到。望尘莫及：远远看见前面人马扬起的尘土却追不上。比喻远远落后。前者指「管辖不到」，后者指「追赶不上」。",question:"总公司对海外分公司的日常管理往往___。",options:["鞭长莫及","望尘莫及"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i35",type:"idiom",words:["鱼龙混杂","鱼目混珠"],meanings:["好的坏的混在一起（人/物）","以假充真（具体物品）"],difference:"鱼龙混杂：鱼和龙混在一起，比喻坏人和好人混在一起。鱼目混珠：鱼眼睛冒充珍珠。比喻以假乱真，用假的冒充真的。前者指「好坏混杂」，后者指「以假冒真」。",question:"收藏市场___，初学者容易上当受骗。",options:["鱼龙混杂","鱼目混珠"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i36",type:"idiom",words:["息息相关","休戚相关"],meanings:["关系密切（广泛）","福祸紧密相连（利害一致）"],difference:"息息相关：呼吸相关联，比喻关系密切。休戚相关：休=欢乐，戚=忧愁。彼此之间的忧乐互相关联，侧重利害一致。前者使用范围更广，后者侧重「同甘共苦」。",question:"环境保护与每个人的健康___。",options:["息息相关","休戚相关"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i37",type:"idiom",words:["举一反三","触类旁通"],meanings:["从一件事类推其他","掌握一类后旁及其他"],difference:"举一反三：举出一件事就可以类推其他许多同类事理。强调类推能力。触类旁通：掌握了某一事物的规律就能推知同类事物。两者近义，前者偏「类推思维」，后者偏「融会贯通」。",question:"学习要学会___，不能死记硬背。",options:["举一反三","触类旁通"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i38",type:"idiom",words:["走马观花","浮光掠影"],meanings:["粗略地观察（动作快）","印象不深刻（表面化）"],difference:"走马观花：骑在马上看花，比喻匆忙粗略地观察。浮光掠影：水面上的反光和一掠而过的影子。比喻观察不细致，印象不深。前者强调「速度太快」，后者强调「印象很浅」。",question:"调研不能___，要深入基层了解实情。",options:["走马观花","浮光掠影"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i39",type:"idiom",words:["义不容辞","责无旁贷"],meanings:["道义上不允许推辞","责任上不能推给别人"],difference:"义不容辞：从道义上讲不允许推辞。责无旁贷：贷=推卸。自己的责任不能推卸给别人。前者强调「道德义务」，后者强调「自身责任」。两者常可互换，但侧重不同。",question:"保护环境是每个人___的责任。",options:["义不容辞","责无旁贷"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i40",type:"idiom",words:["有目共睹","众目睽睽"],meanings:["大家都看得到（事实明显）","在众人注视之下"],difference:"有目共睹：有眼睛的人都能看见，形容事实非常明显。众目睽睽：睽睽=睁大眼睛。在众人注视之下。前者是「事实明显」，后者是「公开场合」。",question:"在___之下，他不敢有任何小动作。",options:["有目共睹","众目睽睽"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i41",type:"idiom",words:["无可置疑","无懈可击"],meanings:["没有什么可怀疑的","没有破绽可挑剔"],difference:"无可置疑：事实明显或理由充足，没有什么可怀疑的。无懈可击：懈=松懈，引申为破绽。没有破绽可以让人挑剔或攻击。前者指「真实可信」，后者指「完美无缺」。",question:"这份证据的真实性___。",options:["无可置疑","无懈可击"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i42",type:"idiom",words:["半途而废","浅尝辄止"],meanings:["中途停止（没做完）","刚入门就停止（没深入）"],difference:"半途而废：走到半路就放弃了。比喻做事有始无终。浅尝辄止：稍微尝试一下就不做了。比喻学习不深入。前者强调「中途放弃」，后者强调「未深入就停止」。",question:"学书法需要持之以恒，不能___。",options:["半途而废","浅尝辄止"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i43",type:"idiom",words:["因地制宜","因势利导"],meanings:["根据当地情况制定办法","顺着趋势加以引导"],difference:"因地制宜：根据各地的具体情况制定适宜的办法。因势利导：顺着事情的发展趋势加以引导。前者侧重「空间差异」，后者侧重「趋势发展」。",question:"发展特色农业要___，不能一刀切。",options:["因地制宜","因势利导"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i44",type:"idiom",words:["急功近利","急于求成"],meanings:["贪图眼前利益","急着取得成功"],difference:"急功近利：急于追求眼前的功利。含贬义，强调目光短浅。急于求成：急着要取得成功。中性偏贬。前者批评「功利主义」，后者批评「急躁心态」。",question:"科研需要耐心，___只会适得其反。",options:["急功近利","急于求成"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i45",type:"idiom",words:["事与愿违","适得其反"],meanings:["事实与愿望相反","结果与预期完全相反（更重）"],difference:"事与愿违：事情的发展与愿望相违背。适得其反：结果与预期完全相反，甚至起到反效果。后者程度更重，强调「起了反作用」。",question:"过度保护孩子___，反而让他们失去独立能力。",options:["事与愿违","适得其反"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i46",type:"idiom",words:["微不足道","微乎其微"],meanings:["非常小不值一提","非常少几乎为零"],difference:"微不足道：足=值得。渺小得不值一提。微乎其微：微小之中更微小。形容非常少或非常小。前者强调「不值一提（主观）」，后者强调「数量极少（客观）」。",question:"这点误差___，可以忽略不计。",options:["微不足道","微乎其微"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i47",type:"idiom",words:["一视同仁","等量齐观"],meanings:["同等看待不偏袒","同等衡量不管差异"],difference:"一视同仁：对人不分厚薄同等看待。等量齐观：对不同事物同等衡量不加区别。前者公平待人，后者忽视差别。",question:"领导对员工___，不偏袒任何人。",options:["一视同仁","等量齐观"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i48",type:"idiom",words:["昙花一现","过眼云烟"],meanings:["短暂出现后消失","很快消失不留痕迹"],difference:"昙花一现：美好事物出现后很快就消失。过眼云烟：很快就消失的事物，不值得在意。",question:"互联网风口上的很多项目___，很快被遗忘。",options:["昙花一现","过眼云烟"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i49",type:"idiom",words:["博采众长","兼收并蓄"],meanings:["广泛采纳各家优点","把各种东西都吸收进来"],difference:"博采众长：广泛采纳各家长处优点。兼收并蓄：把不同内容都接收保存下来。前者取长补短，后者包容万象。",question:"好的产品设计要___，吸收各方优秀经验。",options:["博采众长","兼收并蓄"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"i50",type:"idiom",words:["侃侃而谈","娓娓道来"],meanings:["从容自信地说话","连续生动地讲述"],difference:"侃侃而谈：说话从容自信。娓娓道来：说话生动连续不断。前者自信从容，后者生动连贯。",question:"他___地讲述了这次旅行的见闻。",options:["侃侃而谈","娓娓道来"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},

    // === 词语辨析 ===
    {id:"w01",type:"word",words:["推脱","推托"],meanings:["推卸、摆脱责任","借故拒绝（不是自己的事）"],difference:"推脱：推卸、摆脱（多指责任、义务等本属于自己的事）。推托：借故拒绝（多指邀请、请求等不是自己分内的事）。核心区别：「脱」的是本属于自己的责任，「托」的是别人请求的事。",question:"他___有事，没有参加晚上的聚餐。",options:["推脱","推托"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w02",type:"word",words:["遏制","遏止"],meanings:["压制控制（压制住）","用力阻止（使其停止）"],difference:"遏制：制=控制。压制、控制，使不发作。对象多为情绪、势头等。遏止：止=停止。用力阻止，使完全停下来。后者力度更重，强调「彻底停止」。",question:"政府出台措施___房价过快上涨。",options:["遏制","遏止"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w03",type:"word",words:["必须","必需"],meanings:["一定要（副词）","一定要有、不可少（动词）"],difference:"必须：副词，修饰动词，表示事理上和情理上的必要。必需：动词，表示一定要有、不可少。'必须'修饰动作，'必需'修饰名词（必需品）。",question:"氧气是人类生存所___的物质。",options:["必须","必需"],correctIndex:1,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w04",type:"word",words:["反映","反应"],meanings:["反照、报告（把情况向上报告）","事情引起的回应/化学反应"],difference:"反映：把客观情况或意见向上级报告，或比喻把本质表现出来。反应：受刺激而引起的活动或变化。'反映'是主动报告，'反应'是被动回应。",question:"群众___小区垃圾清理不及时，物业迅速做出___，当天就清理了。",options:["反映/反应","反应/反映"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w05",type:"word",words:["牟取","谋取"],meanings:["用不正当手段取得（偏贬）","设法取得（中性）"],difference:"牟取：牟=贪取。用不正当手段获取私利，贬义词。谋取：设法取得，中性词。但「谋取」也常用于合法利益。考试常见：「牟取暴利」固定搭配。",question:"不法商家___暴利，必须严惩。",options:["牟取","谋取"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w06",type:"word",words:["界限","界线"],meanings:["事物性质的区别（抽象）","地域、范围的分界（具体）"],difference:"界限：多指抽象事物的区别，如「是非界限」。界线：多指具体地域或范围的分界，如「国界线」。前者偏抽象，后者偏具体，但有时通用。",question:"公与私的___必须划清。",options:["界限","界线"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w07",type:"word",words:["鉴赏","鉴别"],meanings:["欣赏+鉴定（艺术价值）","辨别真假好坏"],difference:"鉴赏：鉴定和欣赏，侧重对艺术品、文物的审美欣赏。鉴别：辨别真假好坏，侧重分辨、区分。'鉴赏'=鉴定+欣赏；'鉴别'=辨别。",question:"他从小学习书法，对名家字画有很高的___能力。",options:["鉴赏","鉴别"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w08",type:"word",words:["启用","起用"],meanings:["开始使用（物/系统）","提拔任用（人）"],difference:"启用：开始使用。对象多为物，如设备、系统、印章。起用：重新任用或提拔任用。对象为人，多指重新任用已退职或免职的官员。",question:"新高铁站将于下月正式___。",options:["启用","起用"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w09",type:"word",words:["溶化","熔化","融化"],meanings:["固体在液体中溶解","固体加热变成液体","冰雪变成水"],difference:"溶化：固体在液体中溶解（糖溶于水）。熔化：固体加热到一定温度变成液体（铁熔化成铁水）。融化：冰雪、霜等变成水（春天雪融化）。",question:"春天来了，冰雪开始___。",options:["溶化","熔化","融化"],correctIndex:2,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w10",type:"word",words:["截止","截至"],meanings:["到期停止（不再延续）","到某个时间点为止（还可继续）"],difference:"截止：到期停止，不再延续。如「报名已于昨日截止」。截至：到某个时间点为止，可能还在继续。如「截至发稿时」。注意：'截止'后面不加时间词，'截至'后面必须加时间词。",question:"报名将于3月31日___。",options:["截止","截至"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w11",type:"word",words:["考察","考查"],meanings:["实地调查","考核检查（知识/能力）"],difference:"考察：实地观察调查，对象多为情况、现象、工作等。考查：用标准来检查衡量，对象多为学习成绩、业务能力等。前者是「了解情况」，后者是「考核评价」。",question:"领导明天来我们单位___工作。",options:["考察","考查"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w12",type:"word",words:["制定","制订"],meanings:["确定（已定案）","创制拟定（还在拟定中）"],difference:"制定：定=确定。已经定下来，成为正式文件。如「制定法律」。制订：订=修订。还在创制拟定过程中，尚未定案。前者强调「已定型」，后者强调「过程」。",question:"全国人大___了这部法律。",options:["制定","制订"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w13",type:"word",words:["贯穿","贯串"],meanings:["穿过、从头到尾","贯穿、连接（更抽象）"],difference:"贯穿：穿过、连通。可用于具体事物（隧道贯穿山岭），也可用于抽象（红线贯穿全文）。贯串：从头到尾串起来。只用于抽象事物（主题贯串全书）。考试中多数情况用「贯穿」即可。",question:"为民服务的理念___整个政策体系。",options:["贯穿","贯串"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w14",type:"word",words:["蔓延","漫延","曼延"],meanings:["像蔓草一样扩展（多指火/病）","水满向外流","连绵不断延伸（多指山脉）"],difference:"蔓延：蔓=蔓草。像蔓草一样延伸扩展。多用于火势、疫情、情绪等。漫延：漫=水满。水满向外流。专指水。曼延：曼=长。连绵不断。多用于山脉、道路。",question:"新冠疫情迅速___至全球。",options:["蔓延","漫延","曼延"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w15",type:"word",words:["变幻","变换"],meanings:["不规则地变化（无常）","有规律地改变"],difference:"变幻：不规则地变化，难以预测。如「风云变幻」。变换：事物的一种形式或内容换成另一种。如「变换位置」。前者强调「不可预测」，后者强调「有意识改变」。",question:"国际局势___莫测，我们需要保持定力。",options:["变幻","变换"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},
    {id:"w16",type:"word",words:["处世","处事"],meanings:["在社会上活动与人交往","处理事务"],difference:"处世：在社会上活动，跟人往来相处。如「处世哲学」。处事：处理具体事务。如「处事果断」。前者是「做人」，后者是「做事」。",question:"他___圆滑，从不轻易得罪人。",options:["处世","处事"],correctIndex:0,reviewCount:0,correctStreak:0,mastered:false,nextReview:null,lastReviewed:null},

// ====== Load & Save ======
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    let loaded = raw ? JSON.parse(raw) : null;
    if (!loaded || !Array.isArray(loaded) || loaded.length === 0) {
      entries = getDefaultData();
      try { save(); } catch {}
    } else {
      entries = loaded;
    }
  } catch { try { entries = getDefaultData(); } catch { entries = []; } }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch {}
  if (isSyncReady()) pushToGist();
}

// ====== Stats ======
function updateStats() {
  document.getElementById('sTotal').textContent = entries.length;
  document.getElementById('sMastered').textContent = entries.filter(e => e.mastered).length;

  // Streak
  const streak = getStreak();
  document.getElementById('sStreak').textContent = streak;

  // Today's count
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = entries.filter(e => {
    return e.lastReviewed && e.lastReviewed.slice(0, 10) === today;
  }).length;
  document.getElementById('sToday').textContent = todayCount;

  // Yesterday count
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  const yestStr = yest.toISOString().slice(0, 10);
  const yestCount = entries.filter(e => {
    return e.lastReviewed && e.lastReviewed.slice(0, 10) === yestStr;
  }).length;
  document.getElementById('sYesterday').textContent = yestCount;

  // Daily goal
  const pct = Math.min(100, Math.round(todayCount / DAILY_GOAL * 100));
  document.getElementById('dailyFill').style.width = pct + '%';
  document.getElementById('dailyTxt').textContent = '今日目标 ' + todayCount + '/' + DAILY_GOAL;
  if (todayCount >= DAILY_GOAL) {
    document.getElementById('dailyTxt').textContent = '今日目标已完成！🎉';
  }
}

function getStreak() {
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today - i * 86400000).toISOString().slice(0, 10);
    const hasReview = entries.some(e => e.lastReviewed && e.lastReviewed.slice(0, 10) === d);
    if (hasReview) streak++;
    else break;
  }
  return streak;
}

// ====== Browse ======
function renderBrowse() {
  const search = document.getElementById('browseSearch').value.toLowerCase();
  const type = document.getElementById('browseType').value;
  let filtered = entries;
  if (type !== 'all') filtered = filtered.filter(e => e.type === type);
  if (search) {
    filtered = filtered.filter(e =>
      e.words.some(w => w.includes(search)) ||
      e.difference.includes(search) ||
      e.question.includes(search)
    );
  }
  document.getElementById('browseList').innerHTML = filtered.map(e => {
    const tag = e.type === 'idiom' ? '<span class="bw-tag idiom">成语</span>' : '<span class="bw-tag word">词语</span>';
    const masteredIcon = e.mastered ? ' ✅' : '';
    return `<div class="browse-item" onclick="openCard('${e.id}')">
      <div class="bw-words">${e.words[0]}<span class="vs">VS</span>${e.words[1] || ''}${tag}${masteredIcon}</div>
      <div class="bw-diff">${e.difference.slice(0, 80)}…</div>
    </div>`;
  }).join('');
}

// ====== Flashcard ======
function openCard(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const allWords = e.words.join(' / ');
  const meanings = e.meanings.join(' · ');
  document.getElementById('cardContent').innerHTML = `<div class="flashcard" style="cursor:default;">
    <div class="word-pair">
      ${e.words.map((w, i) => `<div class="word-item"><div class="word">${w}</div><div class="meaning">${e.meanings[i]}</div></div>`).join('<div class="word-vs">VS</div>')}
    </div>
    <div class="diff-box"><div class="label">辨析要点</div>${e.difference}</div>
    <div style="margin-top:14px;font-size:0.85rem;color:var(--text-dim);">
      <strong>例题：</strong>${e.question.replace(/___/g, '<span style="color:var(--accent);border-bottom:2px dashed var(--accent);padding:0 8px;">___</span>')}<br>
      <strong style="color:var(--accent);">答案：${e.options[e.correctIndex]}</strong>
    </div>
    ${e.mastered ? '<div style="margin-top:8px;color:var(--accent);font-size:0.8rem;">✅ 已掌握</div>' : ''}
  </div>`;
  document.getElementById('cardOverlay').style.display = 'flex';
}

function closeCard() {
  document.getElementById('cardOverlay').style.display = 'none';
}

// ====== Quiz ======
function startQuiz() {
  const shuffled = [...entries].sort(() => Math.random() - 0.5);
  quizState = {
    index: 0, answers: {}, pending: [...shuffled], completed: [],
    firstTry: {}, totalQuestions: shuffled.length, round: 1
  };
  renderQuiz();
}

function renderQuiz() {
  const { index, pending, answers, completed, totalQuestions, round } = quizState;
  if (pending.length === 0) { showQuizSummary(); return; }

  const q = pending[index];
  const answered = answers[q.id] !== undefined;
  const userAns = answers[q.id];
  const qCard = document.getElementById('quizCard');

  let optsHtml = q.options.map((opt, i) => {
    let cls = '';
    if (answered) {
      cls = 'revealed';
      if (i === q.correctIndex) cls += ' correct';
      else if (i === userAns && i !== q.correctIndex) cls += ' wrong';
    }
    return `<div class="quiz-opt ${cls}" onclick="${answered ? '' : `answerQuiz(${i})`}">${opt}</div>`;
  }).join('');

  const done = completed.length;
  const remaining = pending.length;

  let fbHtml = '';
  if (answered) {
    const isCorrect = userAns === q.correctIndex;
    const record = entries.find(r => r.id === q.id);
    const streak = record ? (record.correctStreak || 0) : 0;
    const streakMsg = isCorrect ? ' · 连续正确 ' + streak + '/10' : ' · 清零';
    fbHtml = `<div class="quiz-feedback ${isCorrect ? 'correct' : 'wrong'}">
      <strong>${isCorrect ? '✓ 正确！' + streakMsg : '✗ 错误' + streakMsg + '（稍后再做）'}</strong>
      ${isCorrect && q.meanings ? `<div style="margin-top:10px;padding:10px 14px;background:rgba(0,212,170,0.06);border-radius:8px;line-height:1.8;">
        <div><strong style="color:var(--accent);">${q.words[0]}</strong>：${q.meanings[0]}</div>
        <div><strong style="color:var(--accent);">${q.words[1]}</strong>：${q.meanings[1]}</div>
      </div>` : ''}
      <div style="margin-top:8px;"><strong>辨析：</strong>${q.difference}</div>
    </div>`;
  }

  qCard.innerHTML = `<div class="quiz-counter-row">
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${done/totalQuestions*100}%"></div></div>
    <span class="quiz-num">已完成 ${done}/${totalQuestions} · 剩余 ${remaining}</span>
  </div>
  ${round > 1 ? `<div style="color:var(--warn);font-size:0.78rem;text-align:center;margin-bottom:8px;">第 ${round} 轮 · 错题重做</div>` : ''}
  <div class="quiz-sentence">${q.question.replace(/___/g, '<span class="blank">___</span>')}</div>
  <div class="quiz-options">${optsHtml}</div>
  ${fbHtml}`;

  // Nav: only show next button after answered (for wrong->continue, correct->auto advance or manual)
  const navHtml = answered
    ? `<button class="btn btn-primary" onclick="advanceQuiz()" style="min-width:120px;">${pending.length <= 1 && index === 0 ? '查看成绩' : '继续 ▸'}</button>`
    : '<span style="color:var(--text-dim);font-size:0.78rem;">👆 点击选项作答</span>';
  document.getElementById('quizNav').innerHTML = navHtml;
}

function answerQuiz(optIndex) {
  const { index, pending } = quizState;
  const q = pending[index];
  if (quizState.answers[q.id] !== undefined) return;
  quizState.answers[q.id] = optIndex;

  const isCorrect = optIndex === q.correctIndex;

  // Track first-try correctness
  if (!(q.id in quizState.firstTry)) {
    quizState.firstTry[q.id] = isCorrect;
  }

  const record = entries.find(r => r.id === q.id);
  if (record) {
    record.reviewCount++;
    record.lastReviewed = new Date().toISOString();
    const now = Date.now();
    if (isCorrect) {
      record.correctStreak = (record.correctStreak || 0) + 1;
    } else {
      record.correctStreak = 0;
    }
    // nextReview: if correct on first try → 5 days; if ever wrong → 1 day
    const firstTryCorrect = quizState.firstTry[q.id];
    record.nextReview = new Date(now + (firstTryCorrect ? 5 : 1) * 86400000).toISOString();
    if (record.correctStreak >= 10) record.mastered = true;
  }
  save();
  updateStats();

  renderQuiz();
}

function advanceQuiz() {
  const { index, pending } = quizState;
  if (pending.length === 0) { showQuizSummary(); return; }

  const q = pending[index];
  const userAns = quizState.answers[q.id];
  const wasCorrect = userAns === q.correctIndex;

  if (wasCorrect) {
    // Move from pending to completed
    quizState.completed.push(q);
    quizState.pending.splice(index, 1);
    // Reset index if we removed the last item
    if (index >= pending.length) quizState.index = 0;
  } else {
    // Wrong answer stays in pending for retry; advance index
    if (index >= pending.length - 1) {
      quizState.index = 0;
      quizState.round++;
    } else {
      quizState.index++;
    }
  }

  if (pending.length === 0) { showQuizSummary(); return; }
  renderQuiz();
}

function showQuizSummary() {
  const { completed, totalQuestions, firstTry, round } = quizState;
  const firstTryCorrect = Object.values(firstTry).filter(Boolean).length;
  const pct = Math.round(firstTryCorrect / totalQuestions * 100);
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '👍' : pct >= 50 ? '💪' : '📚';

  document.getElementById('quizCard').innerHTML = `<div style="text-align:center;padding:32px 16px;">
    <div style="font-size:3rem;">${emoji}</div>
    <div style="font-size:2rem;font-weight:700;color:#fff;margin:12px 0;">${firstTryCorrect}/${totalQuestions} 一次就对</div>
    <div style="color:var(--text-dim);">首轮正确率 ${pct}% · 共 ${round} 轮完成</div>
    <div style="color:var(--text-dim);font-size:0.8rem;margin-top:4px;">一次对 → 5天后复习 | 错过 → 明天复习</div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="switchPanel('browse')">返回浏览</button>
      <button class="btn" onclick="startQuiz()">重新刷题</button>
    </div>
  </div>`;
  document.getElementById('quizNav').innerHTML = '';
}

// ====== Panel switch ======
function switchPanel(panel) {
  currentPanel = panel;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (panel === 'browse') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('browsePanel').classList.remove('hidden');
    document.getElementById('quizPanel').classList.add('hidden');
    renderBrowse();
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('browsePanel').classList.add('hidden');
    document.getElementById('quizPanel').classList.remove('hidden');
    startQuiz();
  }
}

// ====== Batch Import ======
function openBatchModal() {
  document.getElementById('batchText').value = '';
  document.getElementById('batchMsg').style.display = 'none';
  document.getElementById('batchOverlay').classList.remove('hidden');
}
function closeBatchModal() {
  document.getElementById('batchOverlay').classList.add('hidden');
}
document.addEventListener('DOMContentLoaded', function() {
  const batchOverlay = document.getElementById('batchOverlay');
  if (batchOverlay) batchOverlay.addEventListener('click', function(e) { if (e.target === this) closeBatchModal(); });
});

function execBatchImport() {
  const raw = document.getElementById('batchText').value.trim();
  if (!raw) { showBatchMsg('请先粘贴词条内容', 'var(--danger)'); return; }

  // Split by blank lines into groups
  const groups = raw.split(/\n\s*\n/).filter(g => g.trim());
  const newEntries = [];
  const errors = [];

  groups.forEach((group, gi) => {
    const lines = group.split(/\n/).map(l => l.trim()).filter(Boolean);
    const words = [], meanings = [];
    let diff = '', question = '', answer = '';

    for (const line of lines) {
      // Try to match numbered or plain "word：meaning" pattern
      let m = line.match(/^(?:\d+[\.\、\)）\s]+)?(.+?)[：:]\s*(.+)$/);
      if (!m) { errors.push('第'+(gi+1)+'组无法解析: ' + line); continue; }
      const key = m[1].trim();
      const val = m[2].trim();

      if (/^辨[析别]/.test(key)) { diff = val; }
      else if (/^例[题]/.test(key) || /^题[目]/.test(key)) { question = val; }
      else if (/^答[案]/.test(key) || /^正[确]/.test(key)) { answer = val; }
      else {
        words.push(key);
        meanings.push(val);
      }
    }

    if (words.length < 2) { errors.push('第'+(gi+1)+'组至少需要两个词'); return; }
    // Auto-generate question if not provided
    if (!question) {
      question = '请选择最适合填入___处的词语。';
    }
    // Auto-generate options from words
    const options = words.slice(0, 4); // max 4 options
    const correctIndex = answer ? options.findIndex(o => o === answer) : 0;
    if (correctIndex < 0 && answer) {
      options[0] = answer;
    }

    newEntries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      type: words.some(w => w.length >= 4) ? 'idiom' : 'word',
      words: words,
      meanings: meanings,
      difference: diff || (words[0] + '与' + words[1] + '的区别'),
      question: question,
      options: options,
      correctIndex: answer ? (options.findIndex(o => o === answer) < 0 ? 0 : options.findIndex(o => o === answer)) : 0,
      reviewCount: 0, correctStreak: 0, mastered: false,
      nextReview: null, lastReviewed: null
    });
  });

  if (newEntries.length === 0) {
    showBatchMsg('解析失败: ' + (errors.join('; ') || '未找到有效词条'), 'var(--danger)');
    return;
  }

  entries = [...newEntries, ...entries];
  save();
  updateStats();
  renderBrowse();
  closeBatchModal();
  showBatchMsg('', '');

  let msg = '成功导入 ' + newEntries.length + ' 组词条';
  if (errors.length) msg += '（' + errors.length + ' 组解析失败）';
  alert(msg);
}

function showBatchMsg(msg, color) {
  const el = document.getElementById('batchMsg');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
  el.style.color = color || 'var(--text-dim)';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Esc key closes card
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeCard();
});

// Init
loadSyncCfg();
load();
updateStats();
renderBrowse();
if (isSyncReady()) { setSyncStatus('on'); pullAndMerge(); } else { setSyncStatus('off'); }
